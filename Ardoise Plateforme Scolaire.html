<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ardoise — Plateforme scolaire</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF8F0; --paper-dim:#F3EEDF; --board:#1F3A2E; --board-dark:#152A20; --board-light:#2C4E3C;
  --chalk:#F4F1E4; --ink:#20201B; --ink-soft:#514C3F; --muted:#8A8270; --line:#DCD4BC;
  --stamp:#A8322D; --stamp-dim:#F4E1DE; --ochre:#B5541F; --ochre-dim:#F3E3D3;
  --good:#2F6B4F; --good-dim:#E1EEE5; --shadow: 0 1px 0 rgba(32,32,27,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--paper-dim);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5;}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;margin:0 0 .3em 0;color:var(--ink);letter-spacing:-.01em;}
p{margin:.3em 0;}
a{color:inherit;}
button{font-family:inherit;font-size:14px;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
::selection{background:var(--ochre-dim);}

#app{min-height:100vh;}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(var(--board),var(--board)),repeating-linear-gradient(0deg,transparent 0 39px,rgba(244,241,228,.035) 39px 40px);padding:32px 16px;}
.gate-card{width:100%;max-width:460px;background:var(--paper);border-radius:2px;box-shadow:0 18px 50px rgba(0,0,0,.35);overflow:hidden;}
.gate-head{background:var(--board);color:var(--chalk);padding:28px 30px 22px;position:relative;display:flex;gap:14px;align-items:flex-start;}
.gate-head .brand{font-family:'Fraunces',serif;font-size:28px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.gate-head .brand small{font-family:'IBM Plex Sans',sans-serif;font-weight:500;font-size:12.5px;color:#C9D6CC;}
.gate-head .sub{color:#C9D6CC;font-size:13.5px;margin-top:6px;max-width:340px;}
.gate-head .logo-box{width:52px;height:52px;border-radius:4px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.gate-head .logo-box img{max-width:100%;max-height:100%;object-fit:contain;}
.gate-body{padding:26px 30px 30px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:6px;}
.role-btn{border:1px solid var(--line);background:#fff;border-radius:2px;padding:16px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--ink);transition:border-color .15s,transform .1s;}
.role-btn:hover{border-color:var(--ochre);}
.role-btn.active{border-color:var(--ochre);background:var(--ochre-dim);}
.role-btn .ic{width:26px;height:26px;}
.role-btn span{font-size:12.5px;font-weight:600;text-align:center;}

.field{margin-bottom:14px;}
.field label{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
.field input,.field select,.field textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--ink);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--ochre);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.hint{font-size:12px;color:var(--muted);margin-top:4px;}
.err{font-size:12.5px;color:var(--stamp);margin-top:8px;min-height:1em;}

.logo-drop{border:2px dashed var(--line);border-radius:2px;padding:16px;text-align:center;cursor:pointer;transition:border-color .15s;background:#fff;}
.logo-drop:hover{border-color:var(--ochre);}
.logo-drop img{max-height:70px;max-width:120px;}
.logo-drop .ph{color:var(--muted);font-size:12.5px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:2px;padding:10px 16px;font-weight:600;font-size:13.5px;}
.btn-primary{background:var(--ochre);color:#fff;}
.btn-primary:hover{background:#9C4517;}
.btn-board{background:var(--board);color:var(--chalk);}
.btn-board:hover{background:var(--board-dark);}
.btn-outline{background:transparent;border-color:var(--line);color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-danger{background:var(--stamp);color:#fff;}
.btn-ghost{background:transparent;color:var(--ink-soft);border:none;padding:6px 8px;}
.btn-block{width:100%;}
.btn-sm{padding:6px 10px;font-size:12.5px;}
.btn:disabled{opacity:.45;cursor:not-allowed;}

.shell{display:grid;grid-template-columns:230px 1fr;min-height:100vh;}
.sidebar{background:var(--board);color:var(--chalk);padding:22px 16px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.sb-brand{font-family:'Fraunces',serif;font-size:20px;font-weight:700;padding:0 8px 14px;border-bottom:1px solid rgba(244,241,228,.15);margin-bottom:14px;display:flex;align-items:center;gap:10px;}
.sb-brand .sb-logo{width:32px;height:32px;border-radius:3px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;}
.sb-brand .sb-logo img{max-width:100%;max-height:100%;}
.sb-user{padding:0 8px 16px;}
.sb-user .name{font-weight:600;font-size:14px;}
.sb-user .role{font-size:11.5px;color:#B9C8BE;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:2px;color:#DCE6DF;font-size:13.5px;font-weight:500;border:none;background:none;text-align:left;width:100%;margin-bottom:2px;}
.nav-item:hover{background:rgba(244,241,228,.08);}
.nav-item.active{background:var(--ochre);color:#fff;}
.nav-spacer{flex:1;}
.nav-bottom{border-top:1px solid rgba(244,241,228,.15);padding-top:10px;margin-top:8px;}

.main{padding:26px 32px 60px;max-width:1180px;}
.topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:20px;gap:16px;flex-wrap:wrap;}
.topbar .titles h1{font-size:24px;}
.topbar .titles .crumb{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.topbar .actions{display:flex;gap:8px;flex-wrap:wrap;}

.card{background:#fff;border:1px solid var(--line);border-radius:2px;margin-bottom:18px;box-shadow:var(--shadow);}
.card-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;border-left:3px solid var(--stamp);}
.card-head h3{font-size:15.5px;}
.card-head .meta{font-size:12px;color:var(--muted);}
.card-body{padding:18px;}
.card-body.pad-0{padding:0;}

.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px;}
.stat{background:#fff;border:1px solid var(--line);border-left:3px solid var(--ochre);border-radius:2px;padding:14px 16px;}
.stat .n{font-family:'Fraunces',serif;font-size:28px;font-weight:600;line-height:1;}
.stat .l{font-size:12px;color:var(--muted);margin-top:6px;}
.stat.alert{border-left-color:var(--stamp);}
.stat.ok{border-left-color:var(--good);}

table{width:100%;border-collapse:collapse;}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);font-weight:600;background:var(--paper-dim);}
td{padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:#FCFAF3;}
td input[type=number]{width:64px;padding:6px 7px;border:1px solid var(--line);border-radius:2px;text-align:center;}
.tbl-wrap{overflow-x:auto;}

.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;}
.badge-ok{background:var(--good-dim);color:var(--good);}
.badge-warn{background:var(--ochre-dim);color:var(--ochre);}
.badge-danger{background:var(--stamp-dim);color:var(--stamp);}
.badge-muted{background:var(--paper-dim);color:var(--muted);}

.pill-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.pill{border:1px solid var(--line);background:#fff;padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.pill.active{background:var(--board);color:var(--chalk);border-color:var(--board);}

.empty{padding:40px 20px;text-align:center;color:var(--muted);}
.empty .ic{font-size:26px;margin-bottom:8px;}
.empty h4{color:var(--ink-soft);margin-bottom:4px;}

.modal-bg{position:fixed;inset:0;background:rgba(20,24,20,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
.modal{background:#fff;border-radius:2px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;border-left:3px solid var(--ochre);}
.modal-head h3{font-size:16px;}
.modal-body{padding:20px;}
.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;}

.toast-wrap{position:fixed;top:18px;right:18px;z-index:80;display:flex;flex-direction:column;gap:8px;}
.toast{background:var(--board);color:var(--chalk);padding:12px 16px;border-radius:2px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.25);border-left:3px solid var(--ochre);min-width:220px;}

.notif-item{display:flex;gap:12px;padding:13px 18px;border-bottom:1px solid var(--line);}
.notif-item:last-child{border-bottom:none;}
.notif-item .dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.notif-item .txt .t1{font-size:13.5px;font-weight:600;}
.notif-item .txt .t2{font-size:12.5px;color:var(--muted);margin-top:2px;}
.notif-item .txt .t3{font-size:11.5px;color:var(--muted);margin-top:4px;}

.checkline{display:flex;align-items:center;gap:8px;}
.divider{height:1px;background:var(--line);margin:16px 0;}

/* ---------- BULLETIN (format sénégalais) ---------- */
.bulletin-doc{
  background:#fff;border:1px solid var(--line);position:relative;overflow:hidden;
  font-family:'IBM Plex Sans',sans-serif;
}
.bulletin-doc .watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-12deg);
  width:110%;height:110%;
  background-repeat:no-repeat;background-position:center center;background-size:contain;
  opacity:.055;pointer-events:none;z-index:0;
}
.bulletin-doc .b-content{position:relative;z-index:1;padding:18px 22px 22px;}

.b-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:10px;}
.b-head .b-left{font-size:12px;line-height:1.45;color:var(--ink-soft);}
.b-head .b-left .sname{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px;}
.b-head .b-left .sline{font-size:11.5px;}
.b-head .b-logo{max-width:120px;max-height:100px;flex-shrink:0;}
.b-head .b-logo img{max-width:100%;max-height:100px;object-fit:contain;}

.b-title{text-align:center;padding:8px 0 14px;border-bottom:2.5px solid var(--board);margin-bottom:0;}
.b-title h2{font-family:'Fraunces',serif;font-size:24px;letter-spacing:.04em;margin:0;text-transform:uppercase;}
.b-title .tr{font-family:'Fraunces',serif;font-size:17px;font-weight:600;margin-top:2px;letter-spacing:.02em;}
.b-title .an{font-size:12.5px;color:var(--ink-soft);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}

.b-idbar{display:flex;flex-wrap:wrap;gap:6px 28px;padding:12px 4px;font-size:12.5px;border-bottom:1px solid var(--line);}
.b-idbar div{white-space:nowrap;}
.b-idbar b{color:var(--ink);}

.b-table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px;}
.b-table th,.b-table td{border:1px solid #A9A28A;padding:4px 6px;text-align:center;vertical-align:middle;}
.b-table th{background:var(--paper-dim);font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--ink-soft);}
.b-table td.disc{text-align:left;font-weight:600;font-size:12px;}
.b-table td.app{text-align:left;font-weight:600;}
.b-table tr.total-row td{background:var(--paper-dim);font-weight:700;font-size:12px;}

.b-summary{margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.b-summary table{width:100%;border-collapse:collapse;font-size:12px;}
.b-summary th,.b-summary td{border:1px solid #A9A28A;padding:5px 8px;}
.b-summary th{background:var(--paper-dim);text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;width:60%;}
.b-summary td{text-align:right;font-weight:700;}
.b-summary td.big{font-family:'Fraunces',serif;font-size:15px;}

.b-obs{margin-top:14px;display:grid;grid-template-columns:1fr 1fr;gap:14px;font-size:11.5px;}
.b-obs .obs-box{border:1px solid #A9A28A;padding:8px 10px;}
.b-obs .obs-box .ttl{font-weight:700;text-transform:uppercase;font-size:10.5px;letter-spacing:.04em;color:var(--ink-soft);margin-bottom:6px;}
.b-obs .obs-box .val{font-family:'Fraunces',serif;font-size:13.5px;font-weight:600;}

.b-foot{margin-top:18px;display:flex;justify-content:space-between;align-items:flex-end;font-size:11.5px;padding-top:10px;}
.b-foot .sig{text-align:center;min-width:180px;}
.b-foot .sig .line{border-bottom:1px solid var(--ink-soft);margin-bottom:4px;height:34px;}

@media print{
  body *{visibility:hidden;}
  #print-area, #print-area *{visibility:visible;}
  #print-area{position:absolute;top:0;left:0;width:100%;display:block !important;}
  #print-area .bulletin-doc{border:none;}
  .bulletin-doc .watermark{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .bulletin-doc,.bulletin-doc *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
@media (max-width:880px){
  .shell{grid-template-columns:1fr;}
  .sidebar{position:relative;height:auto;flex-direction:row;flex-wrap:wrap;padding:14px;}
  .sb-brand,.sb-user{display:none;}
  .nav-item{width:auto;}
  .nav-spacer{display:none;}
  .main{padding:18px 16px 50px;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .role-grid{grid-template-columns:1fr;}
  .field-row,.field-row-3{grid-template-columns:1fr;}
  .b-head{flex-direction:column-reverse;align-items:center;text-align:center;}
  .b-summary{grid-template-columns:1fr;}
  .b-obs{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================
   ARDOISE — plateforme scolaire (prototype fonctionnel)
   ========================================================= */
const STORAGE_KEY = "ardoise:ecole:v2";
const NIVEAUX = [
  {code:"CI",cycle:"Élémentaire"},{code:"CP",cycle:"Élémentaire"},{code:"CE1",cycle:"Élémentaire"},
  {code:"CE2",cycle:"Élémentaire"},{code:"CM1",cycle:"Élémentaire"},{code:"CM2",cycle:"Élémentaire"},
  {code:"6e",cycle:"Collège"},{code:"5e",cycle:"Collège"},{code:"4e",cycle:"Collège"},{code:"3e",cycle:"Collège"},
  {code:"2nde",cycle:"Lycée"},{code:"1ere",cycle:"Lycée"},{code:"Tle",cycle:"Lycée"}
];
const TRIMESTRES = ["Trimestre 1","Trimestre 2","Trimestre 3"];
const MOIS_LABELS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

let S = null;
let SESSION = null;
let VIEW = { screen:"gate", tab:"accueil", sub:{} };

/* ---------------- utils ---------------- */
function uid(p){ return p+"_"+Math.random().toString(36).slice(2,9); }
function pad2(n){ return String(n).padStart(2,"0"); }
function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function monthKey(d){ d=d||new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1); }
function anneeScolaire(){
  const now=new Date(); const y=now.getFullYear(); const m=now.getMonth();
  return m>=7 ? `${y}-${y+1}` : `${y-1}-${y}`;
}
function fmtDateHuman(iso){
  if(!iso) return "—";
  const [y,m,d]=iso.split("-");
  const months=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function genMatricule(seq){ return "EL-"+String(seq).padStart(4,"0"); }
function genPin(){ return String(Math.floor(1000+Math.random()*9000)); }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function toast(msg){
  const w=document.getElementById("toastWrap");
  const t=el(`<div class="toast">${esc(msg)}</div>`);
  w.appendChild(t);
  setTimeout(()=>{ t.style.transition="opacity .4s"; t.style.opacity="0"; setTimeout(()=>t.remove(),400); }, 3200);
}
function lireLogo(file, cb){
  const reader=new FileReader();
  reader.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const max=420;
      let w=img.width,h=img.height;
      if(w>max||h>max){ const r=Math.min(max/w,max/h); w=Math.round(w*r); h=Math.round(h*r); }
      const c=document.createElement("canvas"); c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      cb(c.toDataURL("image/png"));
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

/* ---------------- default state ---------------- */
function defaultState(){
  return {
    ecole:{
      nom:"", ville:"", adresse:"", email:"", telephone:"", logo:null,
      cycles:["Élémentaire"], tarifMensuel:15000, adminUser:"", adminPass:"",
      matriculeSeq:0, createdAt:null
    },
    classes:[], matieres:[], eleves:[], notes:[], presences:[], paiements:[],
    convocations:[], notifications:[],
    meta:{ dernierRappelPaiement:null }
  };
}

/* ---------------- storage ---------------- */
async function loadState(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){ S = JSON.parse(res.value); } else { S = defaultState(); }
  }catch(e){ S = defaultState(); }
  ensureShape();
}
async function saveState(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(S), true); }
  catch(e){ console.error(e); toast("⚠ Échec de la sauvegarde"); }
}
function ensureShape(){
  const d = defaultState();
  for(const k in d){ if(!(k in S)) S[k]=d[k]; }
  for(const k in d.ecole){ if(!(k in S.ecole)) S.ecole[k]=d.ecole[k]; }
  if(!S.meta) S.meta = d.meta;
  // migration notes : ancien "devoir" -> "devoir1"
  (S.notes||[]).forEach(n=>{
    if(!("devoir1" in n)){ n.devoir1 = ("devoir" in n) ? n.devoir : null; delete n.devoir; }
    if(!("devoir2" in n)) n.devoir2 = null;
  });
}

/* ---------------- derived helpers ---------------- */
function classeById(id){ return S.classes.find(c=>c.id===id); }
function eleveById(id){ return S.eleves.find(e=>e.id===id); }
function matiereById(id){ return S.matieres.find(m=>m.id===id); }
function elevesOfClasse(classeId){ return S.eleves.filter(e=>e.classeId===classeId && e.actif!==false); }
function matieresOfNiveau(niveau){ return S.matieres.filter(m=>m.niveaux.includes(niveau)); }
function noteFor(eId,mId,tr){ return S.notes.find(n=>n.eleveId===eId&&n.matiereId===mId&&n.trimestre===tr); }

function moyenneMatiere(note){
  if(!note) return null;
  const vals=[];
  if(note.devoir1!=null && note.devoir1!=="") vals.push(parseFloat(note.devoir1));
  if(note.devoir2!=null && note.devoir2!=="") vals.push(parseFloat(note.devoir2));
  if(note.composition!=null && note.composition!=="") vals.push(parseFloat(note.composition));
  if(vals.length===0) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function appreciationMatiere(moy){
  if(moy==null) return {label:"—",cls:"badge-muted"};
  if(moy>=16) return {label:"Très Bien",cls:"badge-ok"};
  if(moy>=14) return {label:"Bien",cls:"badge-ok"};
  if(moy>=12) return {label:"Assez Bien",cls:"badge-warn"};
  if(moy>=10) return {label:"Passable",cls:"badge-warn"};
  if(moy>=8) return {label:"Insuffisant",cls:"badge-danger"};
  return {label:"Médiocre",cls:"badge-danger"};
}
function appreciation(moy){
  if(moy==null) return {label:"—",cls:"badge-muted"};
  if(moy>=16) return {label:"Excellent",cls:"badge-ok"};
  if(moy>=14) return {label:"Très bien",cls:"badge-ok"};
  if(moy>=12) return {label:"Bien",cls:"badge-warn"};
  if(moy>=10) return {label:"Passable",cls:"badge-warn"};
  return {label:"Insuffisant",cls:"badge-danger"};
}
function bulletinFor(eleveId,trimestre){
  const eleve = eleveById(eleveId); if(!eleve) return null;
  const mats = matieresOfNiveau(eleve.niveau);
  let sumPond=0, sumCoef=0, totalMoyX=0;
  const lignes = mats.map(m=>{
    const note = noteFor(eleveId,m.id,trimestre);
    const moy = moyenneMatiere(note);
    const moyX = moy!=null ? moy*m.coefficient : null;
    if(moy!=null){ sumPond+=moy*m.coefficient; sumCoef+=m.coefficient; totalMoyX+=moy*m.coefficient; }
    return { matiere:m, note, moyenne:moy, moyX };
  });
  const moyenneGenerale = sumCoef>0 ? sumPond/sumCoef : null;
  return { eleve, trimestre, lignes, moyenneGenerale, totalCoef:sumCoef, totalMoyX };
}
function rangClasse(classeId,trimestre){
  const eleves = elevesOfClasse(classeId);
  const withAvg = eleves.map(e=>{
    const b = bulletinFor(e.id,trimestre);
    return { eleve:e, moyenne: b.moyenneGenerale };
  }).filter(x=>x.moyenne!=null).sort((a,b)=>b.moyenne-a.moyenne);
  const map = {};
  withAvg.forEach((x,i)=>{ map[x.eleve.id]=i+1; });
  return { rangs:map, total:withAvg.length };
}
function paiementStatut(eleveId,mois){
  const p = S.paiements.find(x=>x.eleveId===eleveId&&x.mois===mois);
  return p ? p.statut : "impaye";
}
function setPaiement(eleveId,mois,statut){
  let p = S.paiements.find(x=>x.eleveId===eleveId&&x.mois===mois);
  if(!p){ p={id:uid("pai"),eleveId,mois,statut,datePaiement:null}; S.paiements.push(p); }
  p.statut = statut;
  p.datePaiement = statut==="paye" ? todayStr() : null;
}
function addNotification(type,eleveId,message){
  S.notifications.unshift({ id:uid("ntf"), type, eleveId, message, date:todayStr(), createdAt:Date.now(), lu:false });
}
function notifsFor(eleveId){ return S.notifications.filter(n=>n.eleveId===eleveId); }
function childrenOfParent(tel){ return S.eleves.filter(e=>e.parentTel===tel && e.actif!==false); }

function checkAutoRappel(){
  const now = new Date(); const mk = monthKey(now);
  if(now.getDate()!==1) return false;
  if(S.meta.dernierRappelPaiement===mk) return false;
  let count=0;
  S.eleves.filter(e=>e.actif!==false).forEach(e=>{
    if(paiementStatut(e.id,mk)!=="paye"){
      addNotification("rappel_paiement", e.id, `Rappel : la mensualité de ${MOIS_LABELS[now.getMonth()]} (${S.ecole.tarifMensuel.toLocaleString("fr-FR")} FCFA) est attendue pour ${e.prenom} ${e.nom}.`);
      count++;
    }
  });
  S.meta.dernierRappelPaiement = mk;
  return count>0;
}

/* ---------------- routing ---------------- */
function go(screen,tab,sub){ VIEW.screen=screen; if(tab) VIEW.tab=tab; VIEW.sub=sub||{}; render(); }
function setTab(tab,sub){ VIEW.tab=tab; VIEW.sub=sub||{}; render(); }

async function boot(){
  await loadState();
  if(S.ecole && S.ecole.createdAt){
    const ranNow = checkAutoRappel();
    if(ranNow) await saveState();
    VIEW.screen = "gate";
  } else {
    VIEW.screen = "onboarding";
  }
  render();
}
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  if(VIEW.screen==="onboarding") app.appendChild(renderOnboarding());
  else if(VIEW.screen==="gate") app.appendChild(renderGate());
  else if(VIEW.screen==="admin") app.appendChild(renderAdminShell());
  else if(VIEW.screen==="eleve") app.appendChild(renderEleveShell());
  else if(VIEW.screen==="parent") app.appendChild(renderParentShell());
}

          <button class="btn btn-outline btn-sm" data-edit="${e.id}">Modifier</button>

        </td>
      </tr>`);

    });

  const bg = el(`<div class="modal-bg"><div class="modal">
    <div class="modal-head"><h3>${editing?"Modifier l'élève":"Inscrire un élève"}</h3><button class="btn-ghost" id="m-close">✕</button></div>

        <div class="field"><label>Lieu de naissance</label><input id="f-ldn" value="${editing?esc(editing.lieuNaissance||""):""}" placeholder="Ex : Dakar"></div>
      </div>
      <div class="field"><label>Classe</label>
        <select id="f-classe">${S.classes.map(c=>`<option value="${c.id}" ${editing&&editing.classeId===c.id?'selected':''}>${esc(c.nom)} (${c.niveau})</option>`).join("")}</select>

        <div class="field"><label>Téléphone du parent</label><input id="f-parent-tel" value="${editing?esc(editing.parentTel||""):""}" placeholder="77 123 45 67"></div>

  bg.querySelector("#m-cancel").addEventListener("click",()=>bg.remove());
  bg.querySelector("#m-save").addEventListener("click", async ()=>{
    const prenom=bg.querySelector("#f-prenom").value.trim();
    const nom=bg.querySelector("#f-nom").value.trim();
    const sexe=bg.querySelector("#f-sexe").value;
    const dateNaissance=bg.querySelector("#f-ddn").value;
    const lieuNaissance=bg.querySelector("#f-ldn").value.trim();
    const classeId=bg.querySelector("#f-classe").value;
    const parentNom=bg.querySelector("#f-parent-nom").value.trim();
    const parentTel=bg.querySelector("#f-parent-tel").value.trim();
    if(!prenom||!nom||!classeId||!parentTel){ bg.querySelector("#f-err").textContent="Prénom, nom, classe et téléphone du parent sont requis."; return; }
    const cl = classeById(classeId);
    if(editing){
      Object.assign(editing,{prenom,nom,sexe,dateNaissance,lieuNaissance,classeId,niveau:cl.niveau,parentNom,parentTel});
    } else {
      S.ecole.matriculeSeq++;
      S.eleves.push({
        id:uid("el"), matricule:genMatricule(S.ecole.matriculeSeq), pin:genPin(),

      });

/* ------- RENDU DU BULLETIN (format sénégalais) ------- */
function renderBulletinDoc(eleve,trimestre,rang,total){
  const cl = classeById(eleve.classeId);
  const b = bulletinFor(eleve.id,trimestre);
  const eff = elevesOfClasse(eleve.classeId).length;
  const app = appreciation(b.moyenneGenerale);

  // observations conseil
  let mention = "Doit redoubler d'efforts";
  if(b.moyenneGenerale!=null){
    if(b.moyenneGenerale>=14) mention = "Félicitations";
    else if(b.moyenneGenerale>=12) mention = "Encouragements";
    else if(b.moyenneGenerale>=10) mention = "Passe en classe supérieure";
  }
  const naissance = (eleve.dateNaissance || eleve.lieuNaissance)
    ? `${eleve.dateNaissance?fmtDateHuman(eleve.dateNaissance):"—"}${eleve.lieuNaissance?(" à "+eleve.lieuNaissance):""}`
    : "—";

  const ecole = S.ecole;
  const logoHtml = ecole.logo ? `<div class="b-logo"><img src="${ecole.logo}" alt="Logo"></div>` : `<div class="b-logo"></div>`;
  const watermarkStyle = ecole.logo ? `style="background-image:url('${ecole.logo}');"` : `style="display:none;"`;

  const lignesHtml = b.lignes.map(l=>{
    const ap = appreciationMatiere(l.moyenne);
    const d1 = l.note && l.note.devoir1!=null ? l.note.devoir1 : "—";
    const d2 = l.note && l.note.devoir2!=null ? l.note.devoir2 : "—";
    const comp = l.note && l.note.composition!=null ? l.note.composition : "—";
    const moy = l.moyenne!=null ? l.moyenne.toFixed(2) : "—";
    const mx = l.moyX!=null ? l.moyX.toFixed(2) : "—";
    return `<tr>
      <td class="disc">${esc(l.matiere.nom)}</td>
      <td>${d1}</td>
      <td>${d2}</td>
      <td>${comp}</td>
      <td><b>${moy}</b></td>
      <td>${l.matiere.coefficient}</td>
      <td><b>${mx}</b></td>
      <td class="app"><span class="badge ${ap.cls}" style="font-size:10px;padding:2px 7px;">${ap.label}</span></td>
    </tr>`;
  }).join("");

  const doc = el(`<div class="bulletin-doc" id="bulletin-doc">
    <div class="watermark" ${watermarkStyle}></div>
    <div class="b-content">
      <div class="b-head">
        <div class="b-left">
          <div class="sname">${esc(ecole.nom||"Établissement scolaire")}</div>
          ${ecole.adresse?`<div class="sline">${esc(ecole.adresse)}</div>`:""}
          ${ecole.ville?`<div class="sline">${esc(ecole.ville)}</div>`:""}
          ${ecole.telephone?`<div class="sline">Tél : ${esc(ecole.telephone)}</div>`:""}
          ${ecole.email?`<div class="sline">Email : ${esc(ecole.email)}</div>`:""}
        </div>
        ${logoHtml}

/* ---- présences ---- */
function adminPresences(){
  const wrap = document.createElement("div");
  wrap.innerHTML = pageHead("Présences","Vie scolaire");
  if(S.classes.length===0){ wrap.appendChild(el(`<div class="card"><div class="card-body"><div class="empty"><h4>Créez d'abord une classe</h4></div></div></div>`)); return wrap; }
  const sub = VIEW.sub;
  if(!sub.classeId) sub.classeId = S.classes[0].id;
  if(!sub.date) sub.date = todayStr();

  const selectors = el(`<div class="card"><div class="card-body">
    <div class="field-row">
      <div class="field"><label>Classe</label><select id="s-classe">${S.classes.map(c=>`<option value="${c.id}" ${c.id===sub.classeId?'selected':''}>${esc(c.nom)}</option>`).join("")}</select></div>
      <div class="field"><label>Date</label><input type="date" id="s-date" value="${sub.date}"></div>
    </div>
  </div></div>`);
  selectors.querySelector("#s-classe").addEventListener("change",e=>{ sub.classeId=e.target.value; render(); });
  selectors.querySelector("#s-date").addEventListener("change",e=>{ sub.date=e.target.value; render(); });
  wrap.appendChild(selectors);

  const eleves = elevesOfClasse(sub.classeId);
  const card = el(`<div class="card"><div class="card-head"><h3>Appel — ${fmtDateHuman(sub.date)}</h3><span class="meta">Cocher = absent</span></div><div class="card-body pad-0"><div class="tbl-wrap" id="grid"></div></div></div>`);
  const grid = card.querySelector("#grid");
  if(eleves.length===0){ grid.appendChild(el(`<div class="empty"><h4>Aucun élève</h4></div>`)); }
  else {
    const tbl = el(`<table><thead><tr><th>Élève</th><th>Absent</th><th>Motif</th></tr></thead><tbody></tbody></table>`);
    const tb = tbl.querySelector("tbody");
    eleves.forEach(e=>{
      const pres = S.presences.find(p=>p.eleveId===e.id && p.date===sub.date);
      const isAbs = pres && pres.statut==="absent";
      tb.appendChild(el(`<tr>
        <td>${esc(e.prenom)} ${esc(e.nom)}</td>
        <td><input type="checkbox" data-el="${e.id}" class="chk-abs" ${isAbs?'checked':''}></td>
        <td><input type="text" data-el="${e.id}" class="motif-inp" placeholder="Motif (optionnel)" value="${pres?esc(pres.motif||""):""}" style="width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:2px;" ${isAbs?'':'disabled'}></td>
      </tr>`));
    });
    grid.appendChild(tbl);
    grid.querySelectorAll(".chk-abs").forEach(chk=>{
      chk.addEventListener("change",()=>{
        const motifInp = chk.closest("tr").querySelector(".motif-inp");
        motifInp.disabled = !chk.checked;
      });
    });
  }
  wrap.appendChild(card);
  const saveBar = el(`<div style="text-align:right;"><button class="btn btn-primary" id="save-presences">Enregistrer l'appel</button></div>`);
  saveBar.querySelector("#save-presences").addEventListener("click", async ()=>{
    let nouvellesAbsences = 0;
    grid.querySelectorAll(".chk-abs").forEach(chk=>{
      const eid = chk.dataset.el;
      const motif = grid.querySelector(`.motif-inp[data-el="${eid}"]`).value.trim();
      let pres = S.presences.find(p=>p.eleveId===eid && p.date===sub.date);
      const wasAbsent = pres && pres.statut==="absent";
      const nowAbsent = chk.checked;
      if(!pres){ pres = {id:uid("pr"),eleveId:eid,date:sub.date,statut:"present",motif:"",signalePar:S.ecole.adminUser}; S.presences.push(pres); }
      pres.statut = nowAbsent ? "absent" : "present";
      pres.motif = nowAbsent ? motif : "";
      pres.signalePar = S.ecole.adminUser;
      if(nowAbsent && !wasAbsent){
        const e = eleveById(eid);
        addNotification("absence", eid, `${e.prenom} ${e.nom} a été signalé(e) absent(e) le ${fmtDateHuman(sub.date)}${motif?(" — motif : "+motif):""}.`);
        nouvellesAbsences++;
      }
    });
    await saveState();
    toast(nouvellesAbsences>0 ? `Appel enregistré — ${nouvellesAbsences} notification(s) envoyée(s)` : "Appel enregistré ✓");
    render();
  });
  wrap.appendChild(saveBar);
  return wrap;
}

/* ---- paiements ---- */
function adminPaiements(){
  const wrap = document.createElement("div");
  const sub = VIEW.sub;
  if(!sub.mois) sub.mois = monthKey();
  const [y,m] = sub.mois.split("-");
  const label = `${MOIS_LABELS[parseInt(m)-1]} ${y}`;
  wrap.innerHTML = pageHead("Paiements","Finances",`<button class="btn btn-board" id="send-rappels">📣 Envoyer les rappels — ${esc(label)}</button>`);

  const monthPicker = el(`<div class="card"><div class="card-body">
    <div class="field" style="max-width:220px;"><label>Mois</label><input type="month" id="s-mois" value="${sub.mois}"></div>
    <p class="hint">Mensualité standard : <b>${S.ecole.tarifMensuel.toLocaleString("fr-FR")} FCFA</b></p>
  </div></div>`);
  monthPicker.querySelector("#s-mois").addEventListener("change",e=>{ sub.mois=e.target.value; render(); });
  wrap.appendChild(monthPicker);

  const eleves = S.eleves.filter(e=>e.actif!==false);
  const card = el(`<div class="card"><div class="card-body pad-0"><div class="tbl-wrap" id="grid"></div></div></div>`);
  const grid = card.querySelector("#grid");
  if(eleves.length===0){ grid.appendChild(el(`<div class="empty"><h4>Aucun élève</h4></div>`)); }
  else {
    const tbl = el(`<table><thead><tr><th>Élève</th><th>Classe</th><th>Statut</th><th></th></tr></thead><tbody></tbody></table>`);
    const tb = tbl.querySelector("tbody");
    eleves.forEach(e=>{
      const cl = classeById(e.classeId);
      const st = paiementStatut(e.id,sub.mois);
      tb.appendChild(el(`<tr>
        <td>${esc(e.prenom)} ${esc(e.nom)}</td>
        <td>${cl?esc(cl.nom):"—"}</td>
        <td>${st==="paye"?'<span class="badge badge-ok">Payé</span>':'<span class="badge badge-danger">Impayé</span>'}</td>
        <td><button class="btn btn-outline btn-sm" data-toggle="${e.id}">${st==="paye"?"Marquer impayé":"Marquer payé"}</button></td>
      </tr>`));
    });
    grid.appendChild(tbl);
    grid.querySelectorAll("[data-toggle]").forEach(b=>b.addEventListener("click", async ()=>{
      const eid=b.dataset.toggle;
      const cur = paiementStatut(eid,sub.mois);
      setPaiement(eid,sub.mois, cur==="paye"?"impaye":"paye");
      await saveState(); render();
    }));
  }
  wrap.appendChild(card);
  wrap.querySelector("#send-rappels").addEventListener("click", async ()=>{
    let count=0;
    eleves.forEach(e=>{
      if(paiementStatut(e.id,sub.mois)!=="paye"){
        addNotification("rappel_paiement", e.id, `Rappel : la mensualité de ${label} (${S.ecole.tarifMensuel.toLocaleString("fr-FR")} FCFA) reste à régler pour ${e.prenom} ${e.nom}.`);
        count++;
      }
    });
    S.meta.dernierRappelPaiement = sub.mois;
    await saveState();
    toast(count>0 ? `${count} rappel(s) envoyé(s)` : "Tous les élèves sont à jour ✓");
    render();
  });
  return wrap;
}

function renderParentShell(){

  if(kids.length===0){ SESSION=null; go("gate"); return document.createElement("div"); }
  const sub = VIEW.sub; if(!sub.eleveId) sub.eleveId = kids[0].id;
  const items = [{key:"accueil",label:"Notes"},{key:"bulletin",label:"Bulletin"},{key:"presences",label:"Absences"},{key:"paiements",label:"Paiement"},{key:"notifications",label:"Notifications"}];
  let content;
  const eleve = eleveById(sub.eleveId);
  if(VIEW.tab==="presences") content = parentAbsencesTab(eleve);
  else if(VIEW.tab==="paiements") content = parentPaiementTab(eleve);
  else if(VIEW.tab==="notifications") content = parentNotifTab(eleve);
  else if(VIEW.tab==="bulletin") content = parentBulletinTab(eleve);
  else content = parentNotesTab(eleve);

  const frame = shellFrame({ userName: kids[0].parentNom || "Parent", userRole:"Espace parent", navItems:items, content, onNav:(k)=>setTab(k) });
  if(kids.length>1){
    const switcher = el(`<div class="pill-tabs" style="margin-bottom:16px;">${kids.map(k=>`<button class="pill ${sub.eleveId===k.id?'active':''}" data-k="${k.id}">${esc(k.prenom)} ${esc(k.nom)}</button>`).join("")}</div>`);
    switcher.querySelectorAll("[data-k]").forEach(b=>b.addEventListener("click",()=>{ sub.eleveId=b.dataset.k; render(); }));
    const main = frame.querySelector("#main-host");

  return frame;
}
